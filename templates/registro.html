<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="card">
        <h1>Crear cuenta</h1>
        <p class="subtitle">Completa tus datos para registrarte</p>

        <form method="post">
            <input
                type="text"
                name="usuario"
                placeholder="Usuario"
                required
            >

            <input
                type="email"
                name="correo"
                placeholder="Correo"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Contraseña"
                required
            >

            <button class="primary" type="submit">Registrar</button>
        </form>
    </main>
</body>
</html>
