<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
            color: #1e293b;
        }

        .card {
            width: min(90%, 380px);
            padding: 32px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 26px;
        }

        .subtitle {
            margin: 0 0 24px;
            text-align: center;
            color: #64748b;
        }

        input {
            width: 100%;
            margin-bottom: 14px;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .primary:hover {
            background: #1d4ed8;
        }

        .secondary {
            margin-top: 12px;
            background: #e2e8f0;
            color: #1e293b;
        }

        .secondary:hover {
            background: #cbd5e1;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Iniciar sesión</h1>
        <p class="subtitle">Ingresa tus credenciales</p>

        <form method="post">
            <input type="text" name="usuario" placeholder="Usuario" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button class="primary" type="submit">Ingresar</button>
        </form>

        <form action="{{ url_for('registro') }}" method="get">
            <button class="secondary" type="submit">Crear una cuenta</button>
        </form>
    </main>
</body>
</html>
